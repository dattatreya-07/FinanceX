<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032B25" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.5" />
  <!-- Emblem Center FX Letters -->
  <g filter="url(#glow)">
    <!-- F Path -->
    <path d="M 120 150 L 250 150 L 250 200 L 180 200 L 180 235 L 240 235 L 240 280 L 180 280 L 180 362 L 120 362 Z" fill="#FFFFFF" />
    <!-- X Path with Gold Gradient -->
    <path d="M 270 150 L 325 150 L 365 240 L 405 150 L 460 150 L 395 256 L 465 362 L 410 362 L 365 272 L 320 362 L 265 362 L 335 256 Z" fill="url(#goldGrad)" />
  </g>
</svg>
